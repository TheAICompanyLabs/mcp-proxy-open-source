version: '3.8'

services:
  sandbox:
    build: 
      context: ./backend
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      - MCP_LICENSE_KEY=placekeyhere
      - MCP_ENFORCEMENT_MODE=block
    command: >
      /bin/bash -c "
      javac backend/src/main/java/com/walmartlabs/checkout/McpExecutionController.java;
      chmod +x run_backend.sh;
      tail -f /dev/null
      "
