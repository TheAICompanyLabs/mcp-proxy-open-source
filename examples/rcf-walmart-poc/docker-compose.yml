version: '3.8'

services:
  sandbox:
    build: 
      context: ./backend
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      # Securely pulls the key from the host machine's environment
      - MCP_LICENSE_KEY=${MCP_LICENSE_KEY:?Error: MCP_LICENSE_KEY is not set. Please export it first.}
      - MCP_ENFORCEMENT_MODE=block
    command: >
      /bin/bash -c "
      javac backend/src/main/java/com/walmartlabs/checkout/McpExecutionController.java;
      chmod +x run_backend.sh;
      tail -f /dev/null
      "
