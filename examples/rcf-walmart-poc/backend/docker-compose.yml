version: '3.8'

services:
  # 1. The Simulated Walmart Backend
  target-backend:
    build: 
      context: ./backend
    ports:
      - "8080:8080"
    networks:
      - rcf-net

  # 2. THE REAL RCF PROXY
  rcf-proxy:
    image: ubuntu:22.04
    volumes:
      # MUST DO THIS: Place your compiled Linux binary in the poc folder
      - ./mcp-proxy-fips:/app/mcp-proxy-fips 
      - ./logs:/var/log/rcf                           
    command: >
      /app/mcp-proxy-fips 
      --target http://target-backend:8080 
      --port 8443 
      --offline-worm /var/log/rcf/audit.log
    ports:
      - "8443:8443"
    depends_on:
      - target-backend
    networks:
      - rcf-net

  # 3. The Asynchronous Load Tester
  benchmark:
    image: golang:1.21
    volumes:
      - ./benchmark:/app
    working_dir: /app
    command: go run rcf_load_tester.go
    depends_on:
      - rcf-proxy
    networks:
      - rcf-net

networks:
  rcf-net:
    driver: bridge
