# policy.yaml
version: "1.0"
default_action: deny # Default to zero-trust

rules:
  # Allow the agent to read files, but strictly block directory traversal
  - tool: "read_file"
    action: allow
    conditions:
      - path_matches: "^/users/local/safe_workspace/.*"
      - block_traversal: true 

  # Require human approval for any database writes
  - tool: "query_database"
    action: require_approval
    conditions:
      - contains_regex: "(?i)(INSERT|UPDATE|DELETE|DROP)"

