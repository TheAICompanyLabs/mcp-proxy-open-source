# cookbook/web-and-ssrf/policy.yaml
# Target Servers: @modelcontextprotocol/server-fetch, 
    #@modelcontextprotocol/server-puppeteer, playwright-mcp, firecrawl-mcp, browserbase-mcp
# Threats Neutralized: Server-Side Request Forgery (SSRF) hitting cloud metadata services, scanning local loopback/private subnets, protocol smuggling (file://, gopher://), and arbitrary JavaScript evaluation in headless browsers.


version: "1.0"
default_action: deny

rules:
  # 1. READ-ONLY SEARCH & FETCH: Standard external HTTPS web fetching
  - tool: "(?i)^(fetch_url|get_page_content|brave_search|tavily_search)$"
    action: allow
    conditions:
      # Enforce strict HTTPS only (blocks file://, ftp://, gopher://, http://)
      - match_exact_regex: "^https://.*"
      # Hard-block Cloud Metadata Services (AWS, GCP, Azure, DigitalOcean)
      - block_regex: "(?i)(169\\.254\\.169\\.254|metadata\\.google\\.internal|169\\.254\\.170\\.2)"
      # Hard-block Local Loopback & Internal RFC 1918 Subnets
      - block_regex: "(?i)(localhost|127\\.[0-9.]+|0\\.0\\.0\\.0|\\[::1\\]|10\\.[0-9.]+|172\\.(1[6-9]|2[0-9]|3[0-1])\\.[0-9.]+|192\\.168\\.[0-9.]+)"

  # 2. BROWSER AUTOMATION: Navigation & Interaction
  - tool: "(?i)^(puppeteer_navigate|playwright_goto|browser_click|browser_type)$"
    action: allow
    conditions:
      - match_exact_regex: "^https://.*"
      - block_regex: "(?i)(169\\.254\\.169\\.254|localhost|127\\.[0-9.]+|0\\.0\\.0\\.0)"

  # 3. HIGH-RISK ACTIONS: Arbitrary JavaScript evaluation in the browser session
  - tool: "(?i)^(puppeteer_evaluate|playwright_evaluate|execute_javascript)$"
    action: require_approval
    conditions:
      # Block exfiltration primitives and local storage dumping
      - block_regex: "(?i)(localStorage|sessionStorage|document\\.cookie|window\\.fetch|XMLHttpRequest)"

  # 4. DOWNLOAD / FILE SYSTEM DROPS: Block automated binary downloads via browser
  - tool: "(?i)^(puppeteer_download|playwright_save_as)$"
    action: deny
