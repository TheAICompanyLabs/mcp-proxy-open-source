version: "1.0"
default_action: deny

rules:
  - tool: "fetch_url"
    action: allow
    conditions:
      # Block requests to cloud provider metadata IPs and local loopback
      - block_regex: "(169\\.254\\.169\\.254|localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)"
      # Force HTTPS only (block plain HTTP or internal protocols)
      - path_matches: "^https://.*"
      # Example: Restrict to only reading from approved API domains
      - path_matches: "^https://(api\\.github\\.com|api\\.stripe\\.com)/.*"
