version: "1.0"
default_action: deny

rules:
  # 1. Allow pure SELECT queries automatically
  - tool: "query_database"
    action: allow
    conditions:
      - match_exact: "SELECT" # Only allow queries starting with SELECT
      - block_regex: "(?i)(INSERT|UPDATE|DELETE|DROP|TRUNCATE|ALTER|GRANT)"

  # 2. Require human approval for data modification, completely block schema changes
  - tool: "modify_database"
    action: require_approval
    conditions:
      - block_regex: "(?i)(DROP|TRUNCATE|ALTER|GRANT)" # Even with human approval, these are banned
